name: Feature request
description: Suggest an improvement to TubePreview.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe what you'd like to do and what's getting in the way.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Proposed solution
    validations:
      required: true
