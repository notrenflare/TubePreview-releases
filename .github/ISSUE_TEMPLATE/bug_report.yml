name: Bug report
description: Report a problem with TubePreview.
body:
  - type: markdown
    attributes:
      value: Please remove personal information from screenshots and logs.
  - type: input
    id: app-version
    attributes:
      label: TubePreview version
      placeholder: "1.0"
    validations:
      required: true
  - type: input
    id: android-version
    attributes:
      label: Android version
      placeholder: "Android 16"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What did you do before the problem appeared?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include a screenshot if it helps explain the problem.
    validations:
      required: true
