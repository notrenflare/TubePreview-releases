name: Bug report
description: Tell me what went wrong.
body:
  - type: markdown
    attributes:
      value: Please remove personal information from screenshots and logs.
  - type: input
    id: app-version
    attributes:
      label: TubePreview version
      placeholder: "1.0"
    validations:
      required: true
  - type: input
    id: android-version
    attributes:
      label: Android version
      placeholder: "Android 16"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can I reproduce it?
      description: List what you did before the problem appeared.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Include a screenshot if it helps explain the problem.
    validations:
      required: true
